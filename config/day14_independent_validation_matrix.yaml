# Day-14 independent validation matrix
# Purpose:
# Expand the evidence beyond the current calibrated C-band diagnostic.
# This config is a planning artifact first. Implement script support only after confirming runtime feasibility.

study_name: day14_independent_validation_matrix

paper_identity: calibrated_surrogate_framework

claim_policy:
  allow_calibrated_diagnostic: true
  allow_raw_gnpy_validation_claim: false
  allow_experimental_validation_claim: false
  allow_fully_physical_manakov_claim: false

bands:
  - C
  - S

span_counts:
  - 6
  - 8
  - 10
  - 12

launch_powers_dbm:
  - -1.0
  - 1.0
  - 3.0

channel_loading:
  sparse:
    channels: 5
    spacing_ghz: 100
  medium:
    channels: 9
    spacing_ghz: 75
  dense:
    channels: 15
    spacing_ghz: 50

baud_rates_gbd:
  - 32
  - 64

fiber_variants:
  standard_smf:
    attenuation_db_per_km: 0.2
    dispersion_ps_nm_km: 16.7
    gamma_w_inv_km: 1.3
  low_loss_smf:
    attenuation_db_per_km: 0.17
    dispersion_ps_nm_km: 16.7
    gamma_w_inv_km: 1.2

metrics:
  - raw_error_db
  - calibrated_error_db
  - rmse_db
  - mae_db
  - max_abs_error_db
  - loo_rmse_db
  - condition_heldout_rmse_db

acceptance_guidance:
  calibrated_rmse_db_max: 1.0
  loo_rmse_db_max: 1.25
  max_abs_error_db_max: 2.0

manuscript_rule:
  - Report raw and calibrated errors separately.
  - Never hide raw mismatch.
  - Treat agreement as calibrated diagnostic agreement only.
  - If a case fails, report it as a limitation instead of deleting it.
